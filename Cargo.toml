[package]
name = "xavieros"
version = "0.2.0-beta.4"
edition = "2024"
license = "MIT"
description = "An experimental x86_64 no_std hobby OS kernel for XavierOS"

[[bin]]
name = "xavieros"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = false
