[package]
name = "xavieros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A tiny freestanding Rust kernel for XavierOS"

[[bin]]
name = "xavieros"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = false
