timeout: 5
default_entry: 1
graphics: yes
serial: yes
serial_baudrate: 115200

/XavierOS (1024x768)
    protocol: limine
    path: boot():/boot/xavieros.elf
    resolution: 1024x768x32

/XavierOS (1280x720)
    protocol: limine
    path: boot():/boot/xavieros.elf
    resolution: 1280x720x32

/XavierOS (1366x768)
    protocol: limine
    path: boot():/boot/xavieros.elf
    resolution: 1366x768x32
